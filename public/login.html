<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - SEVENTEEN CHEATS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
<div class="logo">SEVENTEEN <span>CHEATS</span></div>
<nav id="nav"></nav>
</header>
<div class="container">
<form class="form" id="form">
<h1>Entrar</h1>
<p class="sub">Acesse sua conta.</p>
<label>Email</label>
<input type="email" name="email" required>
<label>Senha</label>
<input type="password" name="senha" required>
<button class="btn full" style="margin-top:16px">Entrar</button>
<div id="msg"></div>
<p class="sub" style="margin-top:16px">Nao tem conta? <a href="/cadastro.html">Cadastre-se</a></p>
</form>
</div>
<footer>SEVENTEEN CHEATS</footer>
<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById('form').addEventListener('submit', async function(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:f.get('email'), senha:f.get('senha')})});
  const d = await r.json();
  if(r.ok) location.href='/conta.html';
  else document.getElementById('msg').innerHTML = '<div class="msg erro">'+d.erro+'</div>';
});
</script>
</body>
</html>
